[package]
name = "dcc"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.13.2"
heapless = "0.9.3"

defmt = { workspace = true, optional = true }
int-enum = "1.3.0"
motor = { workspace = true }
embassy-time = { workspace = true }

[dev-dependencies]
motor = { workspace = true, features = ["debug"] }

[features]
default = [
]

verbose-transport = []

defmt = [
    "dep:defmt",
    "heapless/defmt",
    "motor/defmt",
    "embassy-time/defmt",
]
