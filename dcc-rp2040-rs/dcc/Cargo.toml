[package]
name = "dcc"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.13.0"
heapless = "0.9.3"

defmt = { version = "1.1.0", optional = true }
bytemuck = "1.25.0"
int-enum = "1.2.0"
motor = { path = "../motor"}

[dev-dependencies]
motor = { path = "../motor", features = ["debug"] }

[features]
default = [
]

verbose-transport = []

defmt = [
    "dep:defmt",
    "heapless/defmt",
    "motor/defmt"
]
