[package]
edition = "2024"
name = "DCC-RP2040-rs"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
embassy-sync = { version = "0.7.1" }
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.0", features = [] }
embassy-rp = { version = "0.8.0", features = ["time-driver", "critical-section-impl", "rp2040", "intrinsics", "rom-v2-intrinsics"] }
#embassy-boot-rp = { version = "0.4.0", features = [] }
#embassy-embedded-hal = { version = "0.3.0" }

defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }

panic-probe = { version = "1.0.0", optional = true }
panic-reset = { version = "0.1.1"}
embedded-hal = { version = "1.0.0" }

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
#embedded-storage = "0.3.1"

#task-watchdog = { version = "0.1.2", features = ["embassy-rp"] }
fixed = "1.29.0"
fixed-macro = "1.2.0"
bytemuck = "1.23.2"
dcc = { path = "../dcc" }
static_cell = "2.1.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }
assign-resources = "0.5.0"
embassy-futures = "0.1.2"
math = { path = "../math"}
motor = { path = "../motor"}

[features]
default = [
    "defmt",
    "probe-rs"
]

defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-executor/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-sync/defmt",
    "embassy-rp/defmt",
#    "embassy-boot-rp/defmt",
    "embedded-hal/defmt-03",
    "panic-probe/print-defmt",
#    "task-watchdog/defmt-embassy-rp"
    "dcc/defmt",
    "embassy-futures/defmt"
]

probe-rs = [
    "dep:panic-probe"
]

skip-include = []
[build-dependencies]
regex = "1.11.2"
