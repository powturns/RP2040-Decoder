[package]
edition = "2024"
name = "DCC-RP2040-rs"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
embassy-sync = { version = "0.8.0" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = [] }
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "rp2040", "intrinsics", "rom-v2-intrinsics"] }
#embassy-boot-rp = { version = "0.4.0", features = [] }
#embassy-embedded-hal = { version = "0.3.0" }

defmt = { workspace = true, optional = true }
defmt-rtt = { version = "1.3.1", optional = true, features = ["disable-blocking-mode"] }

panic-probe = { version = "1.0.0", optional = true }
panic-reset = { version = "0.1.1"}
embedded-hal = { version = "1.0.0" }

cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
#embedded-storage = "0.3.1"

#task-watchdog = { version = "0.1.2", features = ["embassy-rp"] }
fixed = "1.31.0"
fixed-macro = "1.2.0"
dcc = { path = "../dcc" }
dcc-pio-frame = { path = "../dcc-pio-frame" }
static_cell = "2.1.1"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
assign-resources = "0.5.0"
embassy-futures = "0.1.2"
math = { path = "../math"}
motor = { workspace = true }
sequential-storage = { version = "8.0.2", features = ["heapless"] }
embedded-storage-async = "0.4.2"

[features]
default = [
    "defmt",
    "probe-rs"
]

defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-executor/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-sync/defmt",
    "embassy-rp/defmt",
#    "embassy-boot-rp/defmt",
    "embedded-hal/defmt-03",
    "panic-probe/print-defmt",
#    "task-watchdog/defmt-embassy-rp"
    "dcc/defmt",
    "dcc-pio-frame/defmt",
    "motor/defmt",
    "embassy-futures/defmt",
    "sequential-storage/defmt"
]

probe-rs = [
    "dep:panic-probe"
]

verbose-transport = [
    "dcc/verbose-transport"
]

verbose-motor = []

# Persist CVs by erasing and rewriting a single flash sector on every write, instead of the
# default wear-levelled sequential-storage store.
cv-store-raw-flash = []

skip-include = []
[build-dependencies]
regex = "1.13.1"
