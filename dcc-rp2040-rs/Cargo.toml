[workspace]
resolver = "2"

members = ["application", "dcc", "math", "motor"]

[profile.dev]
debug = 2
debug-assertions = true
incremental = false
opt-level = 'z'
overflow-checks = true

[profile.release]
lto = true
opt-level = 'z'
incremental = false
codegen-units = 1
debug = true # needed for probe-rs log locations
debug-assertions = false
overflow-checks = false
