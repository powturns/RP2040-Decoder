[workspace]
resolver = "2"

members = ["application", "dcc", "dcc-pio-frame", "math", "motor"]

# Dependencies used by more than one member
[workspace.dependencies]
defmt = "1.2.0"
motor = { path = "motor" }
embassy-time = { version = "0.5.1", default-features = false }

[profile.dev]
debug = 2
debug-assertions = true
incremental = false
opt-level = 'z'
overflow-checks = true

[profile.release]
lto = true
opt-level = 'z'
incremental = false
codegen-units = 1
debug = true # needed for probe-rs log locations
debug-assertions = false
overflow-checks = false
